<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Aryen Bebek</title>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>

body {
    margin: 0;
    padding: 0;
    font-family: "Quicksand", Arial, sans-serif;
}

/* ==========================================
   EKRAN GEÇİŞ ANİMASYONU
   ========================================== */

.screen {
    width: 100%;
    height: 100vh;
    display: none;
    opacity: 0;
    transition: opacity 1s ease;
}

.screen.active {
    display: block;
    opacity: 1;
}


/* ==========================================
   1. EKRAN
   ========================================== */

.screen1 {
    background-repeat: no-repeat;
    background-position: center center;
    background-attachment: fixed;
    background-size: cover;

    padding-top: 40px;
}


/* ==========================================
   KART
   ========================================== */

.card {
    width: 90%;
    max-width: 450px;
    box-sizing: border-box;

    background: rgba(255, 255, 255, 0.78);

    padding: 30px;

    border-radius: 25px;

    margin: 60px auto;

    text-align: center;

    box-shadow:
        0 0 25px rgba(255, 182, 193, 0.5);

    backdrop-filter: blur(6px);
}


.card h1 {
    font-size: 35px;

    color: #ff7fa8;

    margin-top: 0;
}


/* ==========================================
   DOĞUM TARİHİ
   ========================================== */

.date-box {
    background: #ffe8f1;

    padding: 15px;

    border-radius: 15px;

    font-size: 22px;

    color: #ff5c8a;

    font-weight: bold;

    box-shadow:
        inset 0 0 10px rgba(255, 153, 204, 0.4);

    margin-bottom: 20px;
}


/* ==========================================
   YAŞ BİLGİSİ
   ========================================== */

.age-box {
    background: #fff0f6;

    padding: 20px;

    border-radius: 20px;

    color: #d14b79;

    font-weight: bold;

    box-shadow:
        inset 0 0 10px rgba(255, 150, 180, 0.3);

    margin-top: 20px;
}


.age-title {
    font-size: 17px;

    margin-bottom: 8px;
}


.age {
    font-size: 30px;

    color: #ff5c8a;
}


.total-days {
    margin-top: 15px;

    font-size: 20px;

    color: #d14b79;
}


/* ==========================================
   SAAT / DAKİKA / SANİYE
   ========================================== */

.timer-container {
    display: flex;

    justify-content: center;

    gap: 10px;

    margin-top: 20px;

    flex-wrap: wrap;
}


.time-box {
    background: #fff0f6;

    width: 75px;

    padding: 10px 0;

    border-radius: 15px;

    font-size: 15px;

    color: #d14b79;

    font-weight: bold;

    text-align: center;

    box-shadow:
        inset 0 0 10px rgba(255, 150, 180, 0.3);
}


.time-box span {
    display: block;

    font-size: 23px;

    margin-bottom: 3px;
}


/* ==========================================
   2. EKRAN
   ========================================== */

.screen2 {
    background-repeat: no-repeat;

    background-position: center center;

    background-size: cover;
}

</style>

</head>

<body>


<!-- ==========================================
     EKRAN 1
     ========================================== -->

<div id="screen1"
     class="screen screen1 active">

    <div class="card">

        <h1>👶 Aryen Bebek</h1>

        <p>Doğum Tarihi:</p>

        <div class="date-box">
            18 Kasım 2025
        </div>

        <p>
            Aryen şimdi kaç aylık? 💗
        </p>


        <!-- YAŞ -->

        <div class="age-box">

            <div class="age-title">
                Aryen'in Yaşı
            </div>

            <div class="age"
                 id="yas">

                0 Ay 0 Gün

            </div>

            <div class="total-days"
                 id="toplamGun">

                Toplam 0 Gün

            </div>

        </div>


        <!-- SAAT / DAKİKA / SANİYE -->

        <div class="timer-container">

            <div class="time-box">

                <span id="saat">
                    0
                </span>

                Saat

            </div>


            <div class="time-box">

                <span id="dakika">
                    0
                </span>

                Dakika

            </div>


            <div class="time-box">

                <span id="saniye">
                    0
                </span>

                Saniye

            </div>

        </div>

    </div>

</div>


<!-- ==========================================
     EKRAN 2
     ========================================== -->

<div id="screen2"
     class="screen screen2">

</div>


<script>

/* =================================================
   FOTOĞRAFLAR
   =================================================

   Aynı klasörde bulunan fotoğrafların isimlerini
   buraya yaz.

   ÖRNEK:

   index.html
   aryen1.png
   aryen2.png
   aryen3.jpg
   aryen4.jpg

   ================================================= */

const fotograflar = [

    "aryen1.png",
    "aryen2.png",
    "aryen3.png",
    "aryen4.jpg",
    "aryen5.jpg"

];


/* =================================================
   RASTGELE FOTOĞRAF SEÇ
   ================================================= */

function rastgeleFotograf() {

    const rastgeleIndex =
        Math.floor(
            Math.random() * fotograflar.length
        );

    const secilenFoto =
        fotograflar[rastgeleIndex];


    /*
       Aynı fotoğrafı hem 1. hem 2. ekranda
       kullanıyoruz.
    */

    document.getElementById("screen1").style.backgroundImage =
        'url("' + secilenFoto + '")';

    document.getElementById("screen2").style.backgroundImage =
        'url("' + secilenFoto + '")';
}


/* Sayfa açıldığında fotoğrafı seç */

rastgeleFotograf();



/* =================================================
   YAŞ HESAPLAMA
   ================================================= */

const dogum =
    new Date("2025-11-18T04:00:00");


function updateTimer() {

    const simdi =
        new Date();


    const fark =
        simdi - dogum;


    /* Doğum tarihi henüz gelmediyse */

    if (fark < 0) {

        document.getElementById("yas").textContent =
            "Henüz doğmadı";

        document.getElementById("toplamGun").textContent =
            "Doğum bekleniyor";

        return;
    }


    /* ==========================================
       TAKVİME GÖRE AY HESAPLAMA
       ========================================== */

    let ay = 0;

    let geciciTarih =
        new Date(dogum);


    while (true) {

        let sonrakiAy =
            new Date(geciciTarih);


        sonrakiAy.setMonth(
            sonrakiAy.getMonth() + 1
        );


        if (sonrakiAy <= simdi) {

            ay++;

            geciciTarih =
                sonrakiAy;

        } else {

            break;
        }
    }


    /* ==========================================
       KALAN GÜN
       ========================================== */

    const kalanMilisaniye =
        simdi - geciciTarih;


    const kalanGun =
        Math.floor(
            kalanMilisaniye /
            (1000 * 60 * 60 * 24)
        );


    /* ==========================================
       TOPLAM GÜN
       ========================================== */

    const toplamGun =
        Math.floor(
            fark /
            (1000 * 60 * 60 * 24)
        );


    /* ==========================================
       SAAT
       ========================================== */

    let kalanSure =
        kalanMilisaniye;


    let saat =
        Math.floor(
            kalanSure /
            (1000 * 60 * 60)
        );


    kalanSure %=
        (1000 * 60 * 60);


    /* ==========================================
       DAKİKA
       ========================================== */

    let dakika =
        Math.floor(
            kalanSure /
            (1000 * 60)
        );


    kalanSure %=
        (1000 * 60);


    /* ==========================================
       SANİYE
       ========================================== */

    let saniye =
        Math.floor(
            kalanSure /
            1000
        );


    /* ==========================================
       EKRANA YAZDIR
       ========================================== */

    document.getElementById("yas").textContent =
        ay + " Ay " + kalanGun + " Gün";


    document.getElementById("toplamGun").textContent =
        "Toplam " + toplamGun + " Gün";


    document.getElementById("saat").textContent =
        saat;


    document.getElementById("dakika").textContent =
        dakika;


    document.getElementById("saniye").textContent =
        saniye;
}


/* Her saniye güncelle */

setInterval(
    updateTimer,
    1000
);


updateTimer();



/* =================================================
   EKRAN DEĞİŞTİRME
   ================================================= */

let current = 1;


function switchScreen() {

    if (current === 1) {

        document
            .getElementById("screen1")
            .classList
            .remove("active");


        setTimeout(() => {

            document
                .getElementById("screen2")
                .classList
                .add("active");

        }, 50);


        current = 2;

    }

    else {

        document
            .getElementById("screen2")
            .classList
            .remove("active");


        setTimeout(() => {

            document
                .getElementById("screen1")
                .classList
                .add("active");

        }, 50);


        current = 1;
    }
}


/* 5 saniyede bir ekran değiştir */

setInterval(
    switchScreen,
    5000
);

</script>

</body>
</html>
